[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Data files: readable from other origins, cached for a day to cut repeat requests.
[[headers]]
  for = "/json/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/photos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
