name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on pull requests; never cancel a deploy running on main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build

      # Deploys are paused. This step deployed a static build/ folder, which a Next.js site no
      # longer produces; rework it (Netlify's Next.js support) before turning it back on.
      - name: Deploy to Netlify
        if: ${{ false }}
        run: npx --yes netlify-cli@latest deploy --prod --dir=.next --no-build
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
