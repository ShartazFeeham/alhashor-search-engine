name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on pull requests; never cancel a deploy running on main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Next.js would otherwise report build usage to Vercel; this app talks to no outside service.
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build

      # Deploys are paused (`if: false`). Turn this step back on only with the owner's say-so.
      # Next.js on Netlify must be built and deployed in one command (`--build`): the Next.js
      # plugin writes the function and routing config during the build, so building here and
      # deploying a folder afterwards would lose it. `npm run build` also runs the `prebuild`
      # script that packs the hadis texts into .data/hadis for the server. Each production deploy
      # costs 15 of Netlify's 300 free monthly credits. See the notes in netlify.toml.
      - name: Deploy to Netlify
        if: ${{ false }}
        run: npx --yes netlify-cli@latest deploy --build --prod
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
