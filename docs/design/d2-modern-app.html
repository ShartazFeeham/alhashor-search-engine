<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>BoiKotha App Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<style>
/* Layout concept: a bright, card-based mobile app. Floating bottom tab bar, rounded 16-24px shapes, teal accent, serif Bengali for reading only. */
:root{
  --f-ui:'Hind Siliguri','Noto Sans Bengali',system-ui,sans-serif;
  --f-read:'Noto Serif Bengali','Hind Siliguri',serif;
  --f-lat:'Plus Jakarta Sans',system-ui,sans-serif;
  --page:#d9e8e3; --bg:#f2f8f6; --surface:#ffffff; --surface2:#e7f1ee; --line:#d3e3dd;
  --ink:#0f2d28; --ink2:#46655e; --ink3:#7b948d;
  --accent:#0b8a78; --accent2:#096658; --on-accent:#ffffff; --accent-soft:#d6f0ea;
  --hl:#ffe9a0; --hl-ink:#3a2a00;
  --ok:#1f9d55; --warn:#b86e05; --bad:#cf4337; --link:#1a55c8;
  --pill-e:#25994c; --pill-n:#2f6bdc; --pill-f:#7a8794;
  --bk-bukhari:#0f8a66; --bk-muslim:#3a63c8; --bk-tirmidhi:#c08108; --bk-abudawud:#8a4bb8; --bk-ibnmajah:#d3582a; --bk-nasai:#c3387f; --on-bk:#ffffff;
  --shadow:0 1px 2px rgba(10,50,44,.06),0 8px 22px rgba(10,50,44,.07);
  --rs:18px; --rlh:1.9; --rw:34em;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]):not([data-skin]){
  --page:#050c0a; --bg:#0c1714; --surface:#14231f; --surface2:#1b2f29; --line:#27423b;
  --ink:#e7f3ef; --ink2:#a4bfb8; --ink3:#6f8c85;
  --accent:#3fcbb3; --accent2:#7ee3d0; --on-accent:#042019; --accent-soft:#143a33;
  --hl:#5e4c0e; --hl-ink:#ffefb5; --link:#8ab4ff; --warn:#e8a23c; --bad:#f07468;
  --bk-bukhari:#2fc08f; --bk-muslim:#7096f2; --bk-tirmidhi:#e5a93a; --bk-abudawud:#b688e2; --bk-ibnmajah:#f28c58; --bk-nasai:#e86aa7; --on-bk:#0a1512;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-skin="dark"],:root[data-theme="dark"]:not([data-skin]){
  --page:#050c0a; --bg:#0c1714; --surface:#14231f; --surface2:#1b2f29; --line:#27423b;
  --ink:#e7f3ef; --ink2:#a4bfb8; --ink3:#6f8c85;
  --accent:#3fcbb3; --accent2:#7ee3d0; --on-accent:#042019; --accent-soft:#143a33;
  --hl:#5e4c0e; --hl-ink:#ffefb5; --link:#8ab4ff; --warn:#e8a23c; --bad:#f07468;
  --bk-bukhari:#2fc08f; --bk-muslim:#7096f2; --bk-tirmidhi:#e5a93a; --bk-abudawud:#b688e2; --bk-ibnmajah:#f28c58; --bk-nasai:#e86aa7; --on-bk:#0a1512;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35); color-scheme:dark}
:root[data-skin="sepia"]{
  --page:#e2d3b3; --bg:#f4ead3; --surface:#fbf4e2; --surface2:#eee0c3; --line:#dccba6;
  --ink:#382c19; --ink2:#675638; --ink3:#957f56;
  --accent:#2a7a66; --accent2:#1d5a4b; --on-accent:#fffaf0; --accent-soft:#d8e5d2;
  --hl:#f2d684; --hl-ink:#3a2a00; --link:#2f5aa8;
  --shadow:0 1px 2px rgba(80,55,15,.08),0 8px 22px rgba(80,55,15,.09)}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;-webkit-tap-highlight-color:transparent}
a{color:inherit}
h1,h2,h3,p,ol,ul{margin:0}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 75%,transparent);outline-offset:2px}
.ic{flex:none;display:block}
.lat{font-family:var(--f-lat)}

/* ---------- prototype control bar ---------- */
.ctl{position:sticky;top:env(safe-area-inset-top,0px);z-index:70;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:center;padding:8px 16px;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);font-family:var(--f-lat);font-size:12.5px;font-weight:600}
.ctl-brand{font-weight:800;letter-spacing:.02em;color:var(--accent2)}
.sw{display:inline-flex;align-items:center;gap:7px;cursor:pointer;user-select:none}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw-t{width:34px;height:20px;border-radius:99px;background:var(--line);position:relative;transition:background .2s}
.sw-t::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.sw input:checked+.sw-t{background:var(--accent)}
.sw input:checked+.sw-t::after{transform:translateX(14px)}
.sw input:focus-visible+.sw-t{outline:3px solid color-mix(in srgb,var(--accent) 75%,transparent);outline-offset:2px}
.seg{display:inline-flex;background:var(--surface2);border-radius:99px;padding:3px;gap:2px}
.seg button{padding:5px 12px;border-radius:99px;font-weight:600;font-size:12.5px;color:var(--ink2);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent2);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.ctl select{font-family:var(--f-lat);font-weight:600;font-size:12.5px;padding:6px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface);max-width:190px}

/* ---------- stage (the app frame) ---------- */
.wrap{padding-inline:16px;padding-block:16px 48px}
.stage{--sw:390px;container-type:inline-size;container-name:app;width:min(var(--sw),100%);margin-inline:auto;background:var(--bg);border-radius:30px;box-shadow:0 0 0 1px var(--line),0 24px 60px rgba(0,0,0,.14);overflow:clip;position:relative;min-height:70vh}
.stage.desk{--sw:1120px;border-radius:20px}
.tabstrip{display:flex;align-items:center;gap:8px;padding:8px 14px;font:600 11px/1.2 var(--f-lat);color:var(--ink3);background:var(--surface2);border-bottom:1px solid var(--line);min-width:0}
.tabstrip span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabstrip .fav{width:10px;height:10px;border-radius:3px;background:var(--accent);flex:none}

/* ---------- label pills ---------- */
.cmp{position:relative;margin-top:16px}
.pill{position:absolute;z-index:6;top:-10px;left:10px;display:inline-block;max-width:calc(100% - 20px);padding:3px 8px 4px;border-radius:99px;font:700 10px/1.25 var(--f-lat);letter-spacing:.01em;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 2px 6px rgba(0,0,0,.25);pointer-events:none}
.pill.e{background:var(--pill-e)}
.pill.n{background:var(--pill-n)}
.pill.mix{background:linear-gradient(90deg,var(--pill-e) 0 50%,var(--pill-n) 50% 100%)}
.pill.f{background:var(--pill-f)}
.pill.s{background:var(--surface);color:var(--ink2);box-shadow:inset 0 0 0 1.5px var(--ink3)}
body.nolabels .pill{display:none}
.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%,40%{box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 60%,transparent)}100%{box-shadow:0 0 0 0 transparent}}

/* ---------- top nav (C01) ---------- */
.nav{margin-top:0;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--ctl-h,56px));z-index:40;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav .pill{top:auto;bottom:-10px}
.nav-in{display:flex;align-items:center;gap:12px;padding:10px 16px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.logo{width:36px;height:36px;border-radius:12px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.brand b{display:block;font:800 16px/1.1 var(--f-lat);letter-spacing:-.01em}
.brand small{display:block;font-size:11.5px;color:var(--ink2);line-height:1.2}
.nav-links{display:none;margin-left:12px;gap:2px;align-items:center}
.nav-links button{padding:8px 12px;border-radius:99px;font-weight:600;color:var(--ink2);white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.nav-links button:hover{background:var(--surface2)}
.nav-links button[aria-current="page"]{background:var(--accent-soft);color:var(--accent2)}
.nav-links .new::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--pill-n)}
.iconbtn{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow);color:var(--ink2);flex:none}
.nav-in .iconbtn:first-of-type{margin-left:auto}
.nav-links+.iconbtn{margin-left:8px}
.rp{height:3px;background:transparent}
.rp i{display:block;height:100%;width:0;background:var(--accent);border-radius:0 3px 3px 0;transition:width .12s linear}

/* ---------- bottom tab bar (C02) ---------- */
.fabrow{position:sticky;bottom:calc(92px + env(safe-area-inset-bottom,0px));height:0;z-index:45;display:flex;justify-content:flex-end;padding-right:16px}
.fab{position:absolute;bottom:0;right:16px;width:44px;height:44px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow),0 0 0 1px var(--line);display:grid;place-items:center;color:var(--accent2);transform:translateY(12px) scale(.8);opacity:0;pointer-events:none;transition:all .25s}
.fab.show{transform:none;opacity:1;pointer-events:auto}
.fab .pill{top:auto;bottom:calc(100% + 6px);left:auto;right:0}
.tabbar{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:45;margin:12px 12px 10px;display:none;align-items:center;justify-content:space-between;padding:8px 10px;background:var(--surface);border-radius:26px;box-shadow:var(--shadow),0 0 0 1px var(--line)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:18px;font-size:11.5px;font-weight:600;color:var(--ink3);transition:color .2s,background .2s;min-height:48px;justify-content:center}
.tabbar button[aria-current="page"]{color:var(--accent2);background:var(--accent-soft)}
.tabbar .mid{flex:none;width:58px;height:58px;margin-top:-26px;border-radius:50%;background:var(--accent);color:var(--on-accent);box-shadow:0 8px 18px color-mix(in srgb,var(--accent) 45%,transparent);border:4px solid var(--bg);padding:0;min-height:0}
.tabbar .mid[aria-current="page"]{background:var(--accent2);color:var(--on-accent)}
@container app (max-width: 640px){
  .tabbar{display:flex}
}
@container app (min-width: 641px){
  .fabrow{bottom:20px}
  .nav-links{display:flex}
}

/* ---------- generic ---------- */
.screen{padding:6px 16px 20px;display:flex;flex-direction:column;gap:0}
.h1{font-size:26px;line-height:1.25;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.h2{font-size:19px;line-height:1.3;font-weight:700;text-wrap:balance}
.h3{font-size:15.5px;font-weight:700}
.muted{color:var(--ink2)}
.tiny{font-size:12.5px;color:var(--ink3)}
.eyebrow{font-size:12.5px;font-weight:600;letter-spacing:.02em;color:var(--accent2)}
.card{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:18px 16px 16px;min-width:0}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.nw{flex-wrap:nowrap}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:99px;font-weight:600;background:var(--surface2);color:var(--ink);min-height:42px;transition:transform .12s,background .2s;border:1px solid transparent}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.sm{padding:6px 14px;min-height:36px;font-size:14px}
.btn.done{background:var(--ok);color:#fff}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin;margin-inline:-16px;padding-inline:16px;scroll-snap-type:x proximity}
.chip{padding:7px 14px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-weight:500;white-space:nowrap;color:var(--ink);transition:all .18s;scroll-snap-align:start;display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"],.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip .cnt{font-size:12.5px;opacity:.75}
.field{display:flex;align-items:center;gap:8px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:5px 5px 5px 12px;transition:border-color .2s,box-shadow .2s}
.field:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.field input{flex:1;min-width:0;border:0;background:transparent;outline:0;padding:9px 2px;font-size:16px}
.field .ic{color:var(--ink3)}
mark{background:var(--hl);color:var(--hl-ink);font-weight:700;border-radius:4px;padding:0 2px}
ins{background:color-mix(in srgb,var(--warn) 28%,transparent);text-decoration:none;border-radius:4px;padding:0 2px}
.note{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;color:var(--ink2);background:var(--accent-soft);border-radius:14px;padding:10px 12px}
.note .ic{margin-top:2px;color:var(--accent2)}
.hint{font-size:13.5px;color:var(--ink2)}
.switch-line{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:10px 0}
.tg{position:relative;width:46px;height:28px;border-radius:99px;background:var(--line);flex:none;transition:background .2s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.tg[aria-checked="true"]{background:var(--accent)}
.tg[aria-checked="true"]::after{transform:translateX(18px)}
.tg[disabled]{opacity:.55;cursor:not-allowed}
.divider{height:1px;background:var(--line);margin:4px 0}
.badge{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:12px;background:var(--bk);color:var(--on-bk);font-weight:700;font-size:14px;flex:none}
.badge.sm{width:26px;height:26px;border-radius:9px;font-size:12px}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--accent2)}
.tag.f{background:var(--surface2);color:var(--ink2)}
.tag.n{background:color-mix(in srgb,var(--pill-n) 15%,var(--surface));color:var(--pill-n)}
.lbl{font-size:12.5px;font-weight:600;color:var(--ink3);letter-spacing:.02em}
.sec{margin-top:22px;display:flex;flex-direction:column;gap:12px}
.sec>.h2{padding-inline:2px}

/* ---------- home ---------- */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:22px 18px 18px;background:linear-gradient(160deg,var(--accent-soft),var(--surface));box-shadow:var(--shadow);margin-top:10px}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:var(--accent);opacity:.1}
.hero::before{width:170px;height:170px;right:-50px;top:-60px}
.hero::after{width:90px;height:90px;right:40px;bottom:-40px}
.hero>*{position:relative}
.hero .lead{margin:8px 0 16px;color:var(--ink2);max-width:34em}
.fake-search{width:100%;display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:18px;padding:14px 16px;text-align:left;color:var(--ink3);box-shadow:var(--shadow);border:2px solid transparent}
.fake-search:hover{border-color:var(--accent)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border-radius:20px;padding:14px;box-shadow:var(--shadow);transition:transform .18s;min-width:0}
.tile:hover{transform:translateY(-3px)}
.tile.wide{grid-column:span 2}
.tile .ti{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent2);margin-bottom:4px}
.tile b{font-size:16px}
.tile span.d{font-size:13.5px;color:var(--ink2);line-height:1.4}
.tile.soon{background:transparent;box-shadow:none;border:2px dashed var(--line);color:var(--ink3);justify-content:center;grid-column:span 2}
.daily-c{display:flex;flex-direction:column;gap:10px;border-radius:22px;padding:18px 16px;background:var(--accent);color:var(--on-accent);box-shadow:var(--shadow)}
.daily-c .rt{font-size:18px;line-height:1.8}
.daily-c .btn{background:color-mix(in srgb,var(--on-accent) 18%,transparent);color:var(--on-accent)}
.shelf-wrap{background:var(--surface);border-radius:22px;padding:18px 16px 0;box-shadow:var(--shadow);overflow:hidden}
.shelf{display:flex;align-items:flex-end;justify-content:center;gap:7px;padding-top:8px}
.spine{width:52px;flex:none;border-radius:8px 8px 3px 3px;background:var(--bk);color:var(--on-bk);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:10px 0 12px;gap:8px;transition:transform .2s;box-shadow:inset -5px 0 0 rgba(0,0,0,.12),inset 3px 0 0 rgba(255,255,255,.16)}
.spine:hover,.spine:focus-visible{transform:translateY(-10px)}
.spine .sn{writing-mode:vertical-rl;font-weight:700;font-size:15px;letter-spacing:.02em;white-space:nowrap}
.spine .sc{font-size:10.5px;opacity:.85;font-weight:600}
.spine .bd{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:12px;font-weight:700}
.plank{height:14px;margin:0 -16px;background:linear-gradient(var(--surface2),var(--line));border-top:2px solid var(--line)}
.qlinks{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qlinks button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;background:var(--surface);border-radius:18px;font-size:12.5px;font-weight:600;box-shadow:var(--shadow);color:var(--ink2)}
.qlinks .ic{color:var(--accent2)}

/* ---------- footer (C30) ---------- */
.foot{margin:26px 16px 10px;padding:18px 16px;border-radius:22px;background:var(--surface2);display:flex;flex-direction:column;gap:10px;font-size:13.5px;color:var(--ink2)}
.foot .links{display:flex;flex-wrap:wrap;gap:6px 14px;font-weight:600}
.foot .links button{color:var(--accent2);font-weight:600}

/* ---------- hadis card (C08) ---------- */
.list{display:flex;flex-direction:column;gap:18px}
.hcard{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;position:relative;min-width:0}
.hc-h{display:flex;align-items:center;gap:10px;padding:12px 14px;background:color-mix(in srgb,var(--bk) 13%,var(--surface))}
.hc-h b{font-size:15px;line-height:1.3}
.hc-h .rank{margin-left:auto;font:700 11px var(--f-lat);color:var(--ink3)}
.hc-b{padding:14px 14px 10px}
.rt{font-family:var(--f-read);font-size:calc(var(--rs) - 1px);line-height:var(--rlh);overflow-wrap:anywhere}
.hc-b .rt{max-width:var(--rw)}
.more{display:inline-block;margin-top:4px;color:var(--link);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.hc-f{display:flex;align-items:center;gap:8px;padding:6px 10px 12px 14px;flex-wrap:wrap}
.hc-f .sp{min-width:4px}
.cpbtn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:99px;background:var(--surface2);font-weight:600;font-size:14px;transition:background .2s,color .2s}
.cpbtn.done{background:var(--ok);color:#fff}
.ibtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);color:var(--ink2);transition:all .18s}
.ibtn[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.ghost-card .hc-b{display:flex;flex-direction:column;gap:9px}
.skl{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--surface2) 0,var(--line) 50%,var(--surface2) 100%);background-size:200% 100%;animation:sh 1.4s linear infinite}
@keyframes sh{to{background-position:-200% 0}}

/* ---------- search ---------- */
.sbox{display:flex;align-items:center;gap:8px;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:6px 6px 6px 14px;transition:all .2s}
.sbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.sbox input{flex:1;min-width:0;border:0;outline:0;background:transparent;padding:10px 2px;font-size:16px}
.sbox .ic{color:var(--ink3)}
.sbox input::-webkit-search-cancel-button{display:none}
.srch-ind{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:var(--accent-soft);color:var(--accent2);font-weight:600}
.srch-ind .bar{flex:1;height:5px;border-radius:9px;background:color-mix(in srgb,var(--accent) 20%,transparent);overflow:hidden;position:relative}
.srch-ind .bar i{position:absolute;inset:0 auto 0 0;width:35%;border-radius:9px;background:var(--accent);animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{left:-35%}100%{left:100%}}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid color-mix(in srgb,var(--accent) 25%,transparent);border-top-color:var(--accent);animation:rot .8s linear infinite;flex:none}
.spin.lg{width:38px;height:38px;border-width:4px}
@keyframes rot{to{transform:rotate(360deg)}}
.sugg{display:flex;flex-direction:column;background:var(--surface);border-radius:16px;border:1px solid var(--line);overflow:hidden}
.sugg button{display:flex;gap:10px;align-items:center;padding:11px 14px;text-align:left;border-bottom:1px solid var(--line)}
.sugg button:last-child{border-bottom:0}
.sugg button:hover{background:var(--surface2)}
.sugg .k{font:700 11px var(--f-lat);padding:3px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent2)}
.dym{font-size:15px;padding:10px 14px;border-radius:14px;background:color-mix(in srgb,var(--warn) 14%,var(--surface));display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dym button{color:var(--link);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.exrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--surface2);flex-wrap:wrap}
.exrow code{font:600 13px var(--f-lat);background:var(--surface);padding:3px 8px;border-radius:8px}
.count-l{display:flex;flex-direction:column;gap:1px}
.count-l b{font-size:17px}
.pager{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
.pager button{min-width:42px;height:42px;padding:0 12px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);font-weight:600}
.pager button[aria-current="page"]{background:var(--accent);color:var(--on-accent)}
.pager button[disabled]{opacity:.4;cursor:not-allowed}
.fchip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px 6px 6px;border-radius:99px;background:var(--surface);border:1px solid var(--line);white-space:nowrap;font-weight:500;scroll-snap-align:start;transition:all .18s}
.fchip[aria-pressed="true"]{background:color-mix(in srgb,var(--bk,var(--accent)) 16%,var(--surface));border-color:var(--bk,var(--accent));font-weight:700}
.fchip .cn{font-size:12.5px;color:var(--ink2)}

/* ---------- hadis page ---------- */
.crumbs{display:flex;flex-wrap:wrap;gap:4px 6px;list-style:none;padding:0;font-size:13.5px;color:var(--ink2);align-items:center}
.crumbs li{display:flex;align-items:center;gap:6px}
.crumbs li+li::before{content:"›";color:var(--ink3)}
.crumbs button{color:var(--accent2);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.article{background:var(--surface);border-radius:24px;box-shadow:var(--shadow)}
.ar-h{border-radius:24px 24px 0 0;padding:16px;display:flex;gap:12px;align-items:center;background:color-mix(in srgb,var(--bk) 13%,var(--surface))}
.ar-h .t{display:flex;flex-direction:column;min-width:0}
.ar-h .t b{font-size:17px;line-height:1.3}
.ar-h .t small{color:var(--ink2);font-size:13px}
.ar-b{padding:18px 16px 8px}
.ar-b .rt{font-size:var(--rs);max-width:var(--rw)}
.reading{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:13.5px;color:var(--ink2);flex-wrap:wrap}
.rbar{flex:1;min-width:80px;height:6px;background:var(--surface2);border-radius:9px;overflow:hidden}
.rbar i{display:block;height:100%;width:0;background:var(--accent);border-radius:9px;transition:width .15s linear}
.fold{margin:6px 16px 0;border-radius:16px;background:var(--surface2);overflow:hidden}
.fold-h{width:100%;display:flex;align-items:center;gap:8px;padding:12px 14px;text-align:left;font-size:14.5px;min-height:48px}
.fold-h .fl{font-weight:700;color:var(--accent2);flex:none}
.fold-h .fs{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.fold-h .ic{transition:transform .25s;color:var(--ink3)}
.fold.open .fold-h .ic{transform:rotate(180deg)}
.fold-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s}
.fold.open .fold-b{grid-template-rows:1fr}
.fold-b>div{overflow:hidden}
.fold-b p{padding:0 14px 14px;font-family:var(--f-read);font-size:15px;line-height:1.8;color:var(--ink2)}
.ar-f{padding:12px 16px 16px;display:flex;gap:8px;flex-wrap:wrap}
.permalink{display:flex;align-items:center;gap:8px;margin:0 16px 14px;padding:8px 10px 8px 12px;border-radius:14px;border:1px dashed var(--line);font:600 12.5px var(--f-lat);color:var(--ink2);min-width:0}
.permalink span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pn button{display:flex;flex-direction:column;gap:2px;padding:14px;border-radius:20px;background:var(--surface);box-shadow:var(--shadow);text-align:left;min-height:64px}
.pn button:last-child{text-align:right;align-items:flex-end}
.pn small{color:var(--ink3);font-weight:600}
.pn b{font-size:16px;display:flex;align-items:center;gap:6px}
.swipehint{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;font-size:12.5px;color:var(--ink3)}
.slide-l{animation:sl .35s ease-out}
.slide-r{animation:sr .35s ease-out}
@keyframes sl{from{transform:translateX(40px);opacity:0}}
@keyframes sr{from{transform:translateX(-40px);opacity:0}}
.rel{display:flex;flex-direction:column}
.rel button{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:12px 4px;border-bottom:1px solid var(--line);width:100%}
.rel button:last-child{border-bottom:0}
.rel .rtxt{font-family:var(--f-read);font-size:15.5px;line-height:1.7;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rel .rh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:600;font-size:14px}

/* ---------- share ---------- */
.sheet-demo{background:var(--surface);border-radius:26px 26px 18px 18px;box-shadow:var(--shadow);padding:10px 16px 18px;display:flex;flex-direction:column;gap:14px}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto}
.citebox{display:flex;align-items:center;gap:10px;background:var(--surface2);border-radius:16px;padding:10px 10px 10px 14px;font-weight:600}
.sharetext{font-family:var(--f-read);font-size:15.5px;line-height:1.8;white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:12px 14px;overflow-wrap:anywhere;color:var(--ink2)}
.chan{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chan button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink2);padding:8px 2px}
.chan .ci{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff}
.qwrap{display:flex;justify-content:center}
.qcard{position:relative;width:100%;max-width:340px;aspect-ratio:1/1;border-radius:18px;padding:8% 9%;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.18);transition:all .3s;container-type:inline-size}
.qcard.story{aspect-ratio:9/16;max-width:230px}
.qcard .qm{font:800 70px/0.7 var(--f-lat);opacity:.35}
.qcard .qt{font-family:var(--f-read);font-weight:500;line-height:1.75;font-size:clamp(11px,4.6cqw,19px)}
.qcard.story .qt{font-size:clamp(11px,6cqw,19px)}
.qcard .qf{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;font-size:clamp(9px,3.3cqw,12px);font-weight:600;line-height:1.35}
.qcard .qb{font:800 clamp(10px,3.6cqw,13px) var(--f-lat);letter-spacing:-.01em;display:flex;align-items:center;gap:6px}
.qs0{background:linear-gradient(150deg,#0e8f7d,#0a5d6b);color:#f2fffb}
.qs1{background:linear-gradient(160deg,#0f1f2e,#1c3a4a);color:#e8f4f2}
.qs2{background:#f6ecd6;color:#3a2d1a;box-shadow:inset 0 0 0 7px #f6ecd6,inset 0 0 0 8px #b49a63,0 12px 30px rgba(0,0,0,.18)}
.qs3{background:linear-gradient(160deg,#fff3dc,#ffd9c2 55%,#f7b7b0);color:#4a2218}
.styles{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.sty{width:44px;height:44px;border-radius:14px;border:3px solid transparent;box-shadow:0 0 0 1px var(--line);transition:transform .15s}
.sty[aria-pressed="true"]{border-color:var(--accent);transform:scale(1.1)}
.chat{border-radius:20px;padding:16px 12px;display:flex;flex-direction:column;gap:8px}
.chat.wa{background:#e5ddd5;background-image:radial-gradient(#d9d0c5 1px,transparent 1px);background-size:14px 14px}
.chat.fb{background:#f0f2f5}
.chat.tg{background:#9dc3da}
.bubble{align-self:flex-end;max-width:92%;border-radius:14px 14px 4px 14px;padding:5px;color:#111;font-size:14px;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.chat.wa .bubble{background:#d9fdd3}
.chat.fb .bubble{background:#0a7cff;color:#fff}
.chat.tg .bubble{background:#effdde}
.og{border-radius:10px;overflow:hidden;background:rgba(255,255,255,.65);color:#111}
.chat.fb .og{background:#fff}
.og .img{aspect-ratio:1.91/1;width:100%;display:flex;align-items:center;justify-content:center;padding:8%;text-align:center;font-family:var(--f-read);font-size:12.5px;line-height:1.55;background:linear-gradient(150deg,#0e8f7d,#0a5d6b);color:#f2fffb;container-type:inline-size}
.og .meta{padding:8px 10px 9px;display:flex;flex-direction:column;gap:2px}
.og .dm{font:600 11px var(--f-lat);color:#667;text-transform:uppercase;letter-spacing:.04em}
.og b{font-size:14px;line-height:1.35}
.og .ds{font-size:12.5px;line-height:1.4;color:#444;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chat.tg .og{border-left:3px solid #2a8fbd;border-radius:4px 10px 10px 4px;background:transparent}
.chat.tg .bubble{padding:6px 8px}
.serp{background:#fff;color:#202124;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:3px;font-family:Arial,var(--f-ui),sans-serif;border:1px solid #dfe1e5}
.serp .u{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#4d5156}
.serp .u i{width:24px;height:24px;border-radius:50%;background:#0b8a78;display:grid;place-items:center;color:#fff;font-style:normal;font-weight:700;font-size:11px;flex:none}
.serp .ttl{font-size:19px;line-height:1.3;color:#1a0dab}
.serp .dsc{font-size:14px;line-height:1.55;color:#4d5156}
.code{font:500 12.5px/1.6 ui-monospace,Menlo,monospace;background:var(--surface2);border-radius:14px;padding:12px;overflow-x:auto;white-space:pre;color:var(--ink2)}

/* ---------- books ---------- */
.bk-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bk-pick button{display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 4px;border-radius:18px;background:var(--surface);border:2px solid transparent;box-shadow:var(--shadow);font-weight:600;font-size:14px;transition:all .18s;min-width:0}
.bk-pick button small{font-weight:500;color:var(--ink3);font-size:12px}
.bk-pick button[aria-pressed="true"]{border-color:var(--bk);background:color-mix(in srgb,var(--bk) 12%,var(--surface))}
.bk-head{display:flex;align-items:center;gap:12px;padding:14px;border-radius:20px;background:color-mix(in srgb,var(--bk) 14%,var(--surface))}
.bk-ctl{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;align-items:center}
.bk-ctl button{height:46px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);font-weight:700}
.bk-ctl button[disabled]{opacity:.4}
.rangelab{text-align:center;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:196px;overflow-y:auto;padding:2px}
.rgrid button{padding:9px 4px;border-radius:12px;background:var(--surface2);font-weight:600;font-size:13.5px;font-variant-numeric:tabular-nums}
.rgrid button.on{background:var(--bk);color:var(--on-bk)}
.err{color:var(--bad);font-weight:600;font-size:14px}

/* ---------- topics ---------- */
.tindex{display:flex;flex-wrap:wrap;gap:8px;max-height:176px;overflow-y:auto;padding:2px}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:26px 16px;color:var(--ink2)}
.empty .ei{width:56px;height:56px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;color:var(--ink3)}
.empty b{color:var(--ink);font-size:16px}
.start{display:flex;flex-direction:column;gap:10px}
.start .st{display:flex;gap:12px;align-items:flex-start}
.start .no{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700;flex:none;margin-top:4px}
.start .st>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.edn{font-size:13.5px;color:var(--ink2)}

/* ---------- narrators ---------- */
.nlist{display:flex;flex-direction:column;max-height:250px;overflow-y:auto}
.nlist button{display:flex;align-items:center;gap:10px;padding:11px 8px;border-radius:14px;text-align:left}
.nlist button[aria-pressed="true"]{background:var(--accent-soft)}
.nlist .av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);color:var(--accent2);font-weight:700;flex:none}
.nlist small{margin-left:auto;color:var(--ink3);font-weight:600;font-variant-numeric:tabular-nums}
.bars{display:flex;flex-direction:column;gap:9px}
.barrow{display:grid;grid-template-columns:86px 1fr 52px;gap:8px;align-items:center;font-size:13.5px}
.barrow .tr{height:12px;border-radius:9px;background:var(--surface2);overflow:hidden}
.barrow .tr i{display:block;height:100%;border-radius:9px;background:var(--bk)}
.barrow .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}

/* ---------- compare ---------- */
.cols{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 12px;margin-inline:-2px}
.col{flex:0 0 78%;scroll-snap-align:center;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;min-width:0}
.col .rt{padding:12px 14px;font-size:16px;line-height:1.85}
.col .cs{padding:0 14px 12px;font-size:12.5px;color:var(--ink2);font-weight:600}
@container app (min-width: 720px){
  .cols{overflow:visible;scroll-snap-type:none}
  .col{flex:1 1 0}
}

/* ---------- daily / plans / khutbah ---------- */
.dcard{border-radius:26px;padding:22px 20px;background:linear-gradient(155deg,var(--accent),var(--accent2));color:var(--on-accent);display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.dcard::after{content:"”";position:absolute;right:14px;top:-26px;font:800 150px/1 var(--f-lat);opacity:.12}
.dcard .rt{font-size:calc(var(--rs) + 2px);line-height:1.85}
.dcard .btn{background:color-mix(in srgb,var(--on-accent) 20%,transparent);color:var(--on-accent)}
.dcard .btn.solid{background:var(--on-accent);color:var(--accent2)}
.plan{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow);text-align:left;border:2px solid transparent;min-width:0}
.plan[aria-pressed="true"]{border-color:var(--accent)}
.prog{height:8px;border-radius:9px;background:var(--surface2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .3s}
.days{display:flex;flex-direction:column}
.day{display:flex;gap:12px;align-items:flex-start;padding:12px 2px;border-bottom:1px solid var(--line)}
.day:last-child{border-bottom:0}
.ck{width:28px;height:28px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;color:transparent;flex:none;transition:all .2s;margin-top:2px}
.ck[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.day .dt{flex:1;min-width:0}
.day .dn{font-size:12.5px;font-weight:700;color:var(--ink3)}
.day .ds{font-family:var(--f-read);font-size:15.5px;line-height:1.7;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pick{display:flex;gap:10px;align-items:center;padding:9px 4px;width:100%;text-align:left}
.paper{background:#fffdf8;color:#1d1b16;border-radius:6px;padding:26px 22px;box-shadow:0 10px 30px rgba(0,0,0,.18),0 0 0 1px #e5dfd0;font-family:var(--f-read);position:relative}
.paper h3{font-size:20px;text-align:center;border-bottom:2px solid #1d1b16;padding-bottom:10px;margin-bottom:4px}
.paper .sub{text-align:center;font-size:13px;color:#6a6454;margin-bottom:14px}
.paper ol{padding-left:22px;display:flex;flex-direction:column;gap:14px}
.paper li{line-height:1.85;font-size:16px}
.paper li cite{display:block;font-style:normal;font-size:13.5px;color:#6a6454;margin-top:2px}
.paper .pf{margin-top:18px;border-top:1px solid #ddd;padding-top:8px;font:600 11px var(--f-lat);color:#8a8471;text-align:center}
.paper.big{padding:34px 28px}

/* ---------- settings ---------- */
.prev-box{background:var(--surface2);border-radius:18px;padding:14px}
.prev-box .rt{font-size:var(--rs);max-width:var(--rw)}
.opt{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.opt:last-of-type{border-bottom:0}
.opt .oh{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.opt .oh span{font-weight:600;color:var(--ink3);font-size:13px}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:44px;height:44px;border-radius:14px;background:var(--surface2);font-weight:700}
.stepper .dots{flex:1;display:flex;gap:6px;align-items:center;justify-content:center}
.stepper .dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.stepper .dots i.on{background:var(--accent)}
.opts3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opts3 button,.opts2 button{padding:10px 6px;border-radius:14px;background:var(--surface2);font-weight:600;font-size:14px;border:2px solid transparent}
.opts2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.opts3 button[aria-pressed="true"],.opts2 button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent2)}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.themes button{display:flex;flex-direction:column;gap:8px;align-items:center;padding:8px;border-radius:18px;border:2px solid var(--line);font-weight:600;font-size:13.5px}
.themes button[aria-pressed="true"]{border-color:var(--accent)}
.themes .sw2{width:100%;height:56px;border-radius:12px;display:flex;flex-direction:column;gap:5px;padding:9px;justify-content:center;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.themes .sw2 i{display:block;height:6px;border-radius:4px}

/* ---------- states ---------- */
.stgrid{display:grid;grid-template-columns:1fr;gap:16px}
@container app (min-width: 720px){.stgrid{grid-template-columns:1fr 1fr}}
.center{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:14px 6px}
.nf{border-radius:22px;background:var(--surface2);padding:22px 16px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.nf .big{font:800 64px/1 var(--f-lat);color:var(--accent);letter-spacing:-.04em}

/* ---------- future ---------- */
.fut{filter:saturate(.25)}
.chan-c{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:18px;background:var(--surface2);border:1px dashed var(--ink3)}
.chan-c .ci{width:42px;height:42px;border-radius:14px;background:var(--surface);display:grid;place-items:center;color:var(--ink3);flex:none}
.chan-c>div{flex:1;min-width:0}
.tgmsg{align-self:flex-start;max-width:88%;background:var(--surface);border-radius:14px 14px 14px 4px;padding:10px 12px;font-family:var(--f-read);font-size:15px;line-height:1.75;box-shadow:var(--shadow)}

/* ---------- map ---------- */
.maprow{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow)}
.maprow .mh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.maprow .code{font:800 13px var(--f-lat);padding:0;background:none;color:var(--ink)}
.maprow .mn{font-weight:600;flex:1;min-width:140px}
.maprow .lk{display:flex;flex-wrap:wrap;gap:6px}
.maprow .lk button{padding:4px 11px;border-radius:99px;background:var(--accent-soft);color:var(--accent2);font-weight:600;font-size:13px}
.mapgrid{display:grid;gap:10px;grid-template-columns:1fr}
@container app (min-width: 720px){.mapgrid{grid-template-columns:1fr 1fr}}
.mp{display:inline-block;padding:2px 9px;border-radius:99px;color:#fff;font:700 11px var(--f-lat)}

/* ---------- more sheet / toast ---------- */
#sheet{position:fixed;inset:0;z-index:90;display:none;align-items:flex-end;justify-content:center;background:rgba(5,20,16,.45);padding-top:env(safe-area-inset-top,0px)}
#sheet.open{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}}
#sheet .panel{width:min(var(--sw,390px),100%);max-height:84vh;overflow-y:auto;background:var(--bg);color:var(--ink);border-radius:26px 26px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .28s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.menu button{display:flex;align-items:center;gap:10px;padding:14px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow);text-align:left;font-weight:600}
.menu .ic{color:var(--accent2)}
#toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;z-index:100;opacity:0;pointer-events:none;transition:all .25s;max-width:calc(100vw - 32px);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.3)}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- wide layouts ---------- */
@container app (min-width: 720px){
  .screen{padding:10px 40px 28px}
  .tiles{grid-template-columns:repeat(4,1fr)}
  .tile.wide,.tile.soon{grid-column:span 1}
  .hero{padding:34px 34px 28px}
  .h1{font-size:34px}
  .spine{width:84px}
  .spine .sn{font-size:18px}
  .qlinks{max-width:560px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
  .bk-pick{grid-template-columns:repeat(6,1fr)}
  .rgrid{grid-template-columns:repeat(6,1fr)}
  .foot{margin-inline:40px}
  .chan{max-width:420px}
}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

function makeRe(q){
 const words=q.trim().split(/\s+/).filter(Boolean).map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/[ুূ]/g,'[ুূ]').replace(/[িী]/g,'[িী]'));
 if(!words.length)return null;return new RegExp('('+words.map(w=>w+'্?').join('|')+')','g');
}
const hlText=(t,re)=>{const e=esc(t);return re?e.replace(re,'<mark>$1</mark>'):e};
function snippet(t,re){
 if(!re)return t;const m=new RegExp(re.source).exec(t);if(!m)return t.slice(0,120);
 let s=Math.max(0,m.index-46),e=Math.min(t.length,m.index+m[0].length+72);
 if(s>0){const sp=t.indexOf(' ',s);if(sp>-1&&sp<m.index)s=sp+1}
 if(e<t.length){const sp=t.lastIndexOf(' ',e);if(sp>m.index+m[0].length)e=sp}
 return (s>0?'… ':'')+t.slice(s,e)+(e<t.length?' …':'');
}

const norm=w=>w.replace(/[,।ঃ:()?!‘’'"\/]/g,'').replace(/ূ/g,'ু').replace(/্$/,'');
SC.compare=()=>{
 const ids=S.compare.filter(x=>H[x]);const hs=ids.map(x=>H[x]);
 const toks=h=>full(h).split(/\s+/).filter(w=>!/^\.+$/.test(w));
 const cols=hs.map(h=>{
  const others=hs.filter(o=>o!==h).map(o=>new Set(toks(o).map(norm)));
  const ws=toks(h);let hit=0;
  const html=ws.map(w=>{const shared=others.every(s=>s.has(norm(w)));const mark=S.cmode==='diff'?!shared:shared;if(!shared)hit++;return mark?`<ins>${esc(w)}</ins>`:esc(w)}).join(' ');
  return `<section class="col" ${bkStyle(h.bk)}><div class="hc-h">${badge(h.bk)}<b>${BOOKS[h.bk].name} ${h.n}</b><span class="sp"></span><button class="ibtn" data-act="cmpTog" data-id="${h.id}" aria-label="সরান">${ic('x',16)}</button></div><p class="rt">${html}</p><div class="cs">${bn(ws.length)}টি শব্দের মধ্যে ${bn(ws.length-hit)}টি অন্যদের সাথে মিলেছে</div></section>`;
 }).join('');
 return `
<div class="stack" style="margin-top:10px"><h2 class="h2">হাদীস তুলনা</h2><p class="hint">২ থেকে ৪টি হাদীস পাশাপাশি রেখে আলাদা শব্দ চিহ্নিত করুন।</p></div>
${cmp('C21',`<div class="stack"><div class="lbl">তুলনার হাদীস (${bn(hs.length)}/${bn(4)})</div>
 <div class="chips">${HLIST.map(x=>`<button class="chip" data-act="cmpTog" data-id="${x}" aria-pressed="${S.compare.includes(x)}">${S.compare.includes(x)?ic('check',15):ic('plus',15)}${BOOKS[H[x].bk].name} ${H[x].n}</button>`).join('')}</div>
 <div class="row"><div class="seg" role="group" aria-label="হাইলাইট">${segBtns([['diff','পার্থক্য'],['same','মিল']],S.cmode,'cmode','v')}</div><span class="tiny"><ins>এই রং</ins> চিহ্নিত শব্দ ${S.cmode==='diff'?'অন্যগুলোতে নেই':'সবগুলোতে আছে'}</span></div>

};

SC.map=()=>{

 const cnt={E:Object.values(CMP).filter(x=>/^E/.test(x[1])).length,N:Object.values(CMP).filter(x=>/N\d/.test(x[1])&&!/Future/.test(x[1])).length};
 const sname=Object.fromEntries(SCREEN_LIST);
 return `<div class="stack" style="margin-top:10px"><h2 class="h2 lat" style="font-family:var(--f-lat)">Component map</h2>
 <p class="hint lat" style="font-family:var(--f-lat)">All 32 components of design D2. Tap a screen name to jump to where the component appears. The component flashes when you arrive.</p>
 <div class="row lat" style="font-family:var(--f-lat)"><span class="pill e" style="position:static">E existing</span><span class="pill n" style="position:static">N# new</span><span class="pill mix" style="position:static">E+N mixed</span><span class="pill f" style="position:static">Future</span><span class="pill s" style="position:static">Suggested</span></div>
 <div class="chips lat" style="font-family:var(--f-lat)">${[['all','All 32'],['E','Existing ('+cnt.E+')'],['N','New ('+cnt.N+')'],['F','Future / suggested']].map(([v,t])=>`<button class="chip" data-act="mapf" data-v="${v}" aria-pressed="${f===v}">${t}</button>`).join('')}</div>

 <p class="tiny lat" style="font-family:var(--f-lat)">C01, C02, C28 and C30 are present on every screen. C02 shows only in the phone frame.</p></div>`;

/* ---------------- render ---------------- */
function applyDigits(root){
 if(S.digits!=='en')return;
 const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>/[০-৯]/.test(n.nodeValue)&&!/^(SCRIPT|STYLE|TEXTAREA)$/.test(n.parentNode.nodeName)?1:2});
 const arr=[];while(w.nextNode())arr.push(w.currentNode);arr.forEach(n=>n.nodeValue=en(n.nodeValue));
 $$('input[placeholder]',root).forEach(i=>i.placeholder=en(i.placeholder));
}
function syncCtl(){
 $$('#modeSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===S.mode));
 $$('#skinSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===S.skin));
 $('#scr').value=S.screen;
}
function render(keepScroll){
 const st=$('#stage');st.classList.toggle('desk',S.mode==='desk');
 const t=TITLES[S.screen];const tt=typeof t==='function'?t():t;
 st.innerHTML=`<div class="tabstrip"><span class="fav"></span><span>${esc(tt)}</span></div>${navHTML()}<main class="screen" id="screen">${SC[S.screen]()}</main>${footer()}${fabHTML()}${tabHTML()}`;
 applyDigits(st);syncCtl();bindScreen();onScroll();
 if(!keepScroll)window.scrollTo(0,0);
}
function rerenderKeep(){const y=window.scrollY;render(true);window.scrollTo(0,y)}
function go(s,c){
 S.screen=s;S.sheet&&closeSheet();
 if(s==='results'&&S._fresh){S.loading=true;S._fresh=false;setTimeout(()=>{S.loading=false;if(S.screen==='results')rerenderKeep()},650)}
 render();
 try{history.replaceState(null,'','#'+s)}catch(e){}
 if(c){requestAnimationFrame(()=>{const el=$(`[data-cmp="${c}"]`,$('#stage'));if(el){const y=el.getBoundingClientRect().top+window.scrollY-180;window.scrollTo({top:Math.max(0,y)});el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1700)}})}
}
function bindScreen(){
 const q=$('#q');if(q){q.addEventListener('input',()=>{S.qDraft=q.value;$('#helpers').innerHTML=helpersHTML(q.value);applyDigits($('#helpers'));$('#qclr').hidden=!q.value})}
 const sf=$('#sform');if(sf)sf.addEventListener('submit',e=>{e.preventDefault();doSearch(q.value,'sind')});
 const rf=$('#rform');if(rf)rf.addEventListener('submit',e=>{e.preventDefault();doSearch($('#rq').value,'rind',true)});
 const jf=$('#jform');if(jf)jf.addEventListener('submit',e=>{e.preventDefault();S.jump=$('#jq').value;doJump(S.jump)});
 const tf=$('#tfilter');if(tf)tf.addEventListener('input',()=>{const v=tf.value.trim();$$('#tindex .chip').forEach(c=>c.hidden=!!v&&!c.dataset.t.includes(v))});
 const nf=$('#nfilter');if(nf)nf.addEventListener('input',()=>{const v=nf.value.trim();$$('#nlist button').forEach(c=>c.hidden=!!v&&!c.dataset.name.includes(v))});
}
function doSearch(v,indId,onResults){
 v=v.trim();if(!v){toast('কিছু লিখুন');return}
 if(/^[A-Za-z ]+$/.test(v)&&ROMAN[v.toLowerCase().split(' ')[0]]){toast('বাংলা প্রস্তাব থেকে একটি বেছে নিন');return}
 const j=parseJump(v);if(j){jumpTo(j.bk,j.n);return}
 S.q=v;S.qDraft=v;const ind=$('#'+indId);if(ind)ind.hidden=false;
 setTimeout(()=>{S.filter='all';S.page=1;S._fresh=true;go('results')},900);
}
function jumpTo(bk,n){
 const h=HLIST.map(x=>H[x]).find(x=>x.bk===bk&&parseInt(en(x.n),10)===n);
 if(h){S.hid=h.id;S.chainOpen=false;go('hadis')}
 else{S.book=bk;S.start=Math.floor((n-1)/20)*20+1;S.jumpMsg=`✓ ${BOOKS[bk].name} ${bn(n)} নং পর্যন্ত পৌঁছানো গেছে (নমুনা)`;go('books')}
}
function doJump(v){
 const j=parseJump(v);
 if(!j){S.jumpMsg='গ্রন্থের নাম আর নম্বর লিখুন, যেমন: বুখারী ১২৩৪';rerenderKeep();focusJ();return}
 const max=BOOKS[j.bk].n;
 if(j.n<1||j.n>max){S.jumpMsg=`${BOOKS[j.bk].name}-এ সর্বোচ্চ ${fmt(max)} নম্বর পর্যন্ত আছে`;rerenderKeep();focusJ();return}
 S.book=j.bk;S.start=Math.floor((j.n-1)/20)*20+1;S.jumpMsg=`✓ ${BOOKS[j.bk].name} ${bn(j.n)} নং হাদীসের পাতায় এসেছেন`;rerenderKeep();
}
function focusJ(){const i=$('#jq');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}

/* ---------------- sheet / toast ---------------- */
let tmr;
function toast(m){const t=$('#toast');t.textContent=S.digits==='en'?en(m):m;t.classList.add('show');clearTimeout(tmr);tmr=setTimeout(()=>t.classList.remove('show'),1900)}
function openSheet(kind){
 S.sheet=kind;const sh=$('#sheet');sh.classList.add('open');sh.setAttribute('aria-hidden','false');sh.style.setProperty('--sw',S.mode==='desk'?'1120px':'390px');
 fillSheet();
}
function fillSheet(){
 const sh=$('#sheet');let html='';
 if(S.sheet==='more'){
  const M=[['narrators','user','বর্ণনাকারী'],['compare','cols','তুলনা'],['daily','plan','আজকের হাদীস ও পরিকল্পনা'],['share','share','শেয়ার'],['comfort','sliders','পড়ার সেটিংস'],['future','bell','সতর্কবার্তা (শীঘ্রই)'],['states','alert','অবস্থা ও ত্রুটি'],['map','grid','Component map']];
  html=`<div class="grab" style="margin:0 auto 10px"></div><h2 class="h2">আরও</h2><div class="menu">${M.map(([s,i,t])=>`<button data-act="go" data-s="${s}">${ic(i,22)}<span>${t}</span></button>`).join('')}</div>`;
 }else{html=`<div class="grab" style="margin:0 auto 10px"></div><div class="row" style="margin-bottom:10px"><h2 class="h2">পড়ার সেটিংস</h2><span class="sp"></span><button class="ibtn" data-act="closeSheet" aria-label="বন্ধ করুন">${ic('x',18)}</button></div>${settingsPanel()}`}
 sh.innerHTML=`<div class="panel" role="dialog" aria-modal="true">${html}</div>`;applyDigits(sh);
 const f=$('button',sh.querySelector('.panel'));if(f&&!sh.dataset.f){}
}
function closeSheet(){S.sheet=null;const sh=$('#sheet');sh.classList.remove('open');sh.setAttribute('aria-hidden','true');sh.innerHTML=''}

/* ---------------- copy ---------------- */
function copySpec(s){const i=s.indexOf(':');const k=s.slice(0,i),id=s.slice(i+1);const h=H[id];
 switch(k){case'card':return full(h)+`\n\n— ${cite(h)}`;case'cite':return cite(h);case'link':return `https://${hurl(h)}`;case'share':{const h2=H[S.qhid];return tail(h2)+(S.shareCite?`\n\n— ${cite(h2)}`:'')+(S.shareLink?`\nhttps://${hurl(h2)}`:'')}case'khutbah':return khutbahText();}return ''}
async function copyText(t){t=S.digits==='en'?en(t):t;try{await navigator.clipboard.writeText(t)}catch(e){const ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(_){}ta.remove()}}

/* ---------------- events ---------------- */
function setScroll(){}
function onScroll(){
 const fab=$('#fab');if(fab)fab.classList.toggle('show',window.scrollY>380);
 if(S.screen==='hadis'){
  const a=$('#article');if(a){const r=a.getBoundingClientRect();const vh=window.innerHeight;const h=r.height;const p=Math.max(0,Math.min(1,(vh*.55-r.top)/Math.max(h,1)));const pc=Math.round(p*100);
   const n=$('#rpi');if(n)n.style.width=pc+'%';const b=$('#rbi');if(b)b.style.width=pc+'%';const t=$('#rpct');if(t)t.textContent=S.digits==='en'?pc+'%':bn(pc)+'%';const pb=t&&t.previousElementSibling;if(pb)pb.setAttribute('aria-valuenow',pc)}
 }else{const n=$('#rpi');if(n)n.style.width='0'}
}
window.addEventListener('scroll',onScroll,{passive:true});
window.addEventListener('resize',measure);
function measure(){const c=$('#ctl');document.documentElement.style.setProperty('--ctl-h',c.offsetHeight+'px')}

function stepHadis(d){
 const i=HLIST.indexOf(S.hid);S.hid=HLIST[(i+d+HLIST.length)%HLIST.length];S.chainOpen=false;render();
 const a=$('#article');if(a)a.classList.add(d>0?'slide-l':'slide-r');
}

document.addEventListener('click',e=>{
 const t=e.target.closest('[data-act]');
 if(e.target.id==='sheet'){closeSheet();return}
 if(!t)return;const a=t.dataset.act;const d=t.dataset;
 switch(a){
 case'go':go(d.s,d.c);break;
 case'mode':S.mode=d.m;render(true);if(S.sheet)$('#sheet').style.setProperty('--sw',S.mode==='desk'?'1120px':'390px');break;
 case'phone':S.mode='phone';go('home');break;
 case'skin':S.skin=d.k;applySettings();syncCtl();if(S.screen==='comfort')rerenderKeep();if(S.sheet)fillSheet();break;
 case'top':window.scrollTo({top:0,behavior:'smooth'});break;
 case'openMore':openSheet('more');break;
 case'openSettings':openSheet('settings');break;
 case'closeSheet':closeSheet();break;
 case'pickBook':S.book=d.b;S.start=({bukhari:301,muslim:1061,tirmidhi:981,abudawud:201,ibnmajah:201,nasai:201})[d.b];S.jumpMsg='';go('books');break;
 case'setBook':S.book=d.b;S.start=({bukhari:301,muslim:1061,tirmidhi:981,abudawud:201,ibnmajah:201,nasai:201})[d.b];S.jumpMsg='';rerenderKeep();break;
 case'bstep':{const tot=BOOKS[S.book].n;S.start=Math.max(1,Math.min(tot,S.start+parseInt(d.d,10)));rerenderKeep();break}
 case'brange':S.start=parseInt(d.s,10);rerenderKeep();break;
 case'jfill':S.jump=d.v;rerenderKeep();break;
 case'sugg':{const q=$('#q');q.value=d.v;S.qDraft=d.v;$('#helpers').innerHTML=helpersHTML(d.v);applyDigits($('#helpers'));$('#qclr').hidden=false;doSearch(d.v,'sind');break}
 case'pickQ':{const q=$('#q');if(q){q.value=d.v;S.qDraft=d.v;$('#helpers').innerHTML=helpersHTML(d.v);$('#qclr').hidden=false;q.focus()}break}
 case'pickQ2':S.q=d.v;S.page=1;const ri=$('#rind');if(ri)ri.hidden=false;setTimeout(()=>{S._fresh=true;go('results')},700);break;
 case'tryQ':{if(S.screen!=='search'){S.qDraft=d.v;go('search');setTimeout(()=>{const q=$('#q');if(q)q.focus()},50);break}const q=$('#q');q.value=d.v;S.qDraft=d.v;$('#helpers').innerHTML=helpersHTML(d.v);applyDigits($('#helpers'));$('#qclr').hidden=false;q.focus();window.scrollTo({top:0,behavior:'smooth'});break}
 case'clearQ':{const q=$('#q');q.value='';S.qDraft='';$('#helpers').innerHTML='';$('#qclr').hidden=true;q.focus();break}
 case'jumpTo':jumpTo(d.b,parseInt(d.n,10));break;
 case'prox':S.prox=!S.prox;if(S.screen==='results'){rerenderKeep();toast(S.prox?'শীর্ষ ৫০টি ফলাফলে কাছাকাছি শব্দ খোঁজা হয়েছে':'সাধারণ ক্রমে ফেরা হয়েছে')}else rerenderKeep();break;
 case'demoInd':{const i=$('#sind2');i.hidden=false;setTimeout(()=>i.hidden=true,2200);break}
 case'filter':S.filter=d.f;S.page=1;rerenderKeep();break;
 case'page':S.page=parseInt(d.p,10);rerenderKeep();break;
 case'open':S.hid=d.id;S.chainOpen=false;go('hadis');break;
 case'hid':S.hid=d.id;S.chainOpen=false;rerenderKeep();window.scrollTo(0,0);break;
 case'nav':stepHadis(parseInt(d.d,10));break;
 case'fold':{S.chainOpen=!S.chainOpen;const f=$('#fold');f.classList.toggle('open',S.chainOpen);t.setAttribute('aria-expanded',S.chainOpen);break}
 case'copy':{const txt=copySpec(d.c);copyText(txt);const l=t.querySelector('.lbl2');const old=l?l.textContent:null;t.classList.add('done');if(l)l.textContent='কপি করা হয়েছে';toast('কপি করা হয়েছে');setTimeout(()=>{t.classList.remove('done');if(l)l.textContent=old},1600);break}
 case'cmpTog':{const i=S.compare.indexOf(d.id);if(i>-1)S.compare.splice(i,1);else if(S.compare.length<4)S.compare.push(d.id);else{toast('সর্বোচ্চ ৪টি হাদীস তুলনা করা যায়');break}
  if(S.screen==='compare'){rerenderKeep()}else{rerenderKeep();toast(i>-1?'তুলনা থেকে সরানো হয়েছে':`তুলনায় যোগ হয়েছে (${bn(S.compare.length)}টি)`)}break}
 case'shareOf':if(SHORT.includes(d.id))S.qhid=d.id;go('share');break;
 case'qhid':S.qhid=d.id;rerenderKeep();break;
 case'shCite':S.shareCite=!S.shareCite;rerenderKeep();break;
 case'shLink':S.shareLink=!S.shareLink;rerenderKeep();break;
 case'chan':toast(`প্রোটোটাইপ: এখানে ${d.n} খুলবে`);break;
 case'qstyle':S.qstyle=parseInt(d.v,10);rerenderKeep();break;
 case'qratio':S.qratio=d.v;rerenderKeep();break;
 case'chat':S.chat=d.v;rerenderKeep();break;
 case'toast':toast(d.m);break;
 case'topic':S.topic=d.t||null;rerenderKeep();break;
 case'nar':S.nar=d.id;rerenderKeep();break;
 case'cmode':S.cmode=d.v;rerenderKeep();break;
 case'dtab':S.dtab=d.v;rerenderKeep();break;
 case'plan':S.plan=d.id;S.planOpen=false;rerenderKeep();break;
 case'planMore':S.planOpen=!S.planOpen;rerenderKeep();break;
 case'day':{const arr=S.planDone[S.plan];const i=parseInt(d.i,10);const k=arr.indexOf(i);k>-1?arr.splice(k,1):arr.push(i);rerenderKeep();break}
 case'khut':{const k=S.khut.indexOf(d.id);k>-1?S.khut.splice(k,1):S.khut.push(d.id);S.khut.sort((a,b)=>HLIST.indexOf(a)-HLIST.indexOf(b));rerenderKeep();break}
 case'paper':S.paper=!S.paper;rerenderKeep();break;
 case'size':S.size=Math.max(0,Math.min(4,S.size+parseInt(d.d,10)));applySettings();S.sheet?fillSheet():rerenderKeep();break;
 case'lh':S.lh=parseInt(d.v,10);applySettings();S.sheet?fillSheet():rerenderKeep();break;
 case'width':S.width=parseInt(d.v,10);applySettings();S.sheet?fillSheet():rerenderKeep();break;
 case'digits':S.digits=d.v;applySettings();S.sheet?(render(true),fillSheet()):rerenderKeep();break;
 case'resetSet':S.size=2;S.lh=1;S.width=1;S.digits='bn';S.skin='light';applySettings();syncCtl();render(true);if(S.sheet)fillSheet();break;
 case'retry':S.stRetry=true;rerenderKeep();setTimeout(()=>{S.stRetry=false;if(S.screen==='states')rerenderKeep()},1400);break;
 case'mapf':S.mapf=d.v;rerenderKeep();break;
 }
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&S.sheet){closeSheet();return}
 if(S.screen==='hadis'&&!/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.nodeName)){
  if(e.key==='ArrowRight'){stepHadis(1)}else if(e.key==='ArrowLeft'){stepHadis(-1)}
 }
});
/* swipe on phones */
let sx=0,sy=0,sOn=false;
document.addEventListener('touchstart',e=>{const a=e.target.closest&&e.target.closest('#article');sOn=!!a&&S.screen==='hadis';if(sOn){sx=e.touches[0].clientX;sy=e.touches[0].clientY}},{passive:true});
document.addEventListener('touchend',e=>{if(!sOn)return;sOn=false;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>60&&Math.abs(dy)<45)stepHadis(dx<0?1:-1)},{passive:true});

/* control bar */
$('#lab').addEventListener('change',e=>document.body.classList.toggle('nolabels',!e.target.checked));
$('#scr').innerHTML=SCREEN_LIST.map(([v,t],i)=>`<option value="${v}">${String(i+1).padStart(2,'0')} ${t}</option>`).join('');
$('#scr').addEventListener('change',e=>go(e.target.value));
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(SC[h]&&h!==S.screen)go(h)});

/* boot */
try{const sv=JSON.parse(store.get('d2')||'null');if(sv){['skin','size','lh','width','digits'].forEach(k=>{if(sv[k]!==undefined)S[k]=sv[k]})}}catch(e){}
applySettings();measure();
const h0=location.hash.slice(1);if(SC[h0])S.screen=h0;
render(true);
if('ResizeObserver' in window)new ResizeObserver(measure).observe($('#ctl'));
})();
</script>

</body></html>
