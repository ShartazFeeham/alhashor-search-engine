<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>BoiKotha D5 Quiet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600&family=Noto+Serif+Bengali:wght@400;500;600;700&family=Newsreader:wght@400;500&display=swap">
<style>
/* Layout concept: one calm reading column on a paper sheet; hairlines instead of boxes; one wine accent; the control bar and pills are the only "tool" layer. */
:root{
  --bg:#fcfbf9; --ground:#f1efeb; --fg:#1f1d1a; --fg2:#5d5851; --fg3:#8f897f; --line:#e7e3dc; --soft:#f3f0ea;
  --accent:#7a3a4c; --on-accent:#fcfbf9; --accent-soft:#f4e8eb;
  --e-fg:#2b7a4b; --e-bg:#e2f1e7; --n-fg:#2a5fa8; --n-bg:#e1ebf8; --f-fg:#6b6b6b; --f-bg:#ebebeb;
  --b1:#4b7a62; --b2:#486c8c; --b3:#8a6a3c; --b4:#7a5a8a; --b5:#a0574a; --b6:#3d7f86;
  --ui:'Hind Siliguri','Noto Sans Bengali',system-ui,sans-serif;
  --read:'Noto Serif Bengali','Noto Serif',Georgia,serif;
  --latin:'Newsreader',Georgia,serif;
  --fs:20px; --lh:2; --measure:38rem;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161514; --ground:#0f0e0d; --fg:#e9e5de; --fg2:#a7a197; --fg3:#77716a; --line:#2b2926; --soft:#201e1c;
  --accent:#d99cab; --on-accent:#1a1214; --accent-soft:#2b1f23;
  --e-fg:#7bc99a; --e-bg:#183024; --n-fg:#8db6ee; --n-bg:#172a45; --f-fg:#a0a0a0; --f-bg:#2a2a2a;
  --b1:#7fb89d; --b2:#86acd0; --b3:#c9a56f; --b4:#b995c9; --b5:#d68f82; --b6:#78bdc4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161514; --ground:#0f0e0d; --fg:#e9e5de; --fg2:#a7a197; --fg3:#77716a; --line:#2b2926; --soft:#201e1c;
  --accent:#d99cab; --on-accent:#1a1214; --accent-soft:#2b1f23;
  --e-fg:#7bc99a; --e-bg:#183024; --n-fg:#8db6ee; --n-bg:#172a45; --f-fg:#a0a0a0; --f-bg:#2a2a2a;
  --b1:#7fb89d; --b2:#86acd0; --b3:#c9a56f; --b4:#b995c9; --b5:#d68f82; --b6:#78bdc4; color-scheme:dark}
:root[data-skin="sepia"]{
  --bg:#f4ead7; --ground:#e8dcc2; --fg:#3a2f22; --fg2:#6d5d48; --fg3:#9a8a71; --line:#dccfb3; --soft:#eadfc8;
  --accent:#86392f; --on-accent:#f7efdf; --accent-soft:#ecd9c4;
  --e-fg:#2f6b44; --e-bg:#dfe8cf; --n-fg:#2c5a93; --n-bg:#d9e2ea; --f-fg:#6b6354; --f-bg:#e2d6bd;
  --b1:#46725a; --b2:#476685; --b3:#86622f; --b4:#75558a; --b5:#9a4f40; --b6:#3a777d; color-scheme:light}

*{box-sizing:border-box}
body{background:var(--ground);color:var(--fg);font-family:var(--ui);font-size:15px;line-height:1.65;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px}
h1,h2,h3,p{margin:0}
.mut{color:var(--fg3)} .sm{font-size:.85rem}
.sp{flex:1}

/* control bar (designer tool layer) */
.ctl{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;font-size:.78rem;font-family:var(--ui)}
.ctl b{font-weight:600;letter-spacing:.02em}
.ctl .grp{display:flex;align-items:center;gap:8px}
.ctl .grp>span{color:var(--fg3)}
.seg{display:inline-flex;background:var(--soft);border-radius:999px;padding:2px}
.seg button{border:0;background:none;padding:2px 10px;border-radius:999px;font-size:.78rem;color:var(--fg2)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.sw{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw .trk{width:30px;height:18px;border-radius:99px;background:var(--line);position:relative;transition:background .2s}
.sw .trk::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--bg);transition:transform .2s}
.sw input:checked+.trk{background:var(--accent)}
.sw input:checked+.trk::after{transform:translateX(12px)}
.sw input:focus-visible+.trk{outline:2px solid var(--accent);outline-offset:2px}
.scr{background:var(--soft);border:0;border-radius:8px;padding:4px 8px;font-size:.78rem;max-width:100%}

.stage{padding:28px 16px 60px}
.frame{container-type:inline-size;container-name:f;margin:0 auto;width:100%;max-width:1040px;background:var(--bg);padding:34px 48px 0;position:relative;border-radius:4px}
.phone .frame{max-width:390px;border-radius:34px;border:1px solid var(--line);padding:30px 18px 0}
@media (max-width:700px){.frame{padding-inline:18px}}

/* marking pills */
.c{position:relative}
.lbl .c{outline:1px dashed var(--line);outline-offset:7px}
.tag{display:none;position:absolute;top:-9px;left:0;z-index:3;font:500 10.5px/1.5 var(--ui);letter-spacing:.01em;padding:0 8px;border-radius:99px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;pointer-events:none;font-variant-numeric:normal}
.lbl .tag{display:block}
.tag.e{background:var(--e-bg);color:var(--e-fg)}
.tag.n{background:var(--n-bg);color:var(--n-fg)}
.tag.m{background:linear-gradient(90deg,var(--e-fg),var(--n-fg));color:var(--bg)}
.tag.f{background:var(--f-bg);color:var(--f-fg);font-style:italic}

/* type */
.h1{font-family:var(--read);font-weight:500;font-size:2.1rem;line-height:1.4;text-wrap:balance}
.h2{font-family:var(--read);font-weight:500;font-size:1.35rem;line-height:1.5;text-wrap:balance}
.eyebrow{font-size:.8rem;color:var(--fg3);letter-spacing:.03em}
.lede{color:var(--fg2);max-width:34rem;font-size:1.02rem}
.read{font-family:var(--read);font-size:var(--fs);line-height:var(--lh);max-width:var(--measure);font-weight:400}
.read b{font-weight:700;color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:44px;padding-bottom:56px}
.sec{display:flex;flex-direction:column;gap:16px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}

/* buttons */
.btn{background:none;border:0;padding:.3em 0;color:var(--fg2);border-bottom:1px solid transparent}
.btn:hover{color:var(--accent);border-bottom-color:currentColor}
.btn:disabled{opacity:.35;cursor:default;border-color:transparent;color:var(--fg2)}
.solid{background:var(--accent);color:var(--on-accent);border:0;border-radius:999px;padding:.55em 1.4em;font-weight:500}
.solid:hover{filter:brightness(1.08)}
.lnk{background:none;border:0;color:var(--accent);padding:0;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px;text-align:left}
.chip{background:var(--soft);border:0;border-radius:999px;padding:.25em .95em;color:var(--fg2);font-size:.92rem;display:inline-flex;align-items:center;gap:.5em}
.chip:hover{color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.chip .n{font-size:.78rem;opacity:.75}
.dot{width:8px;height:8px;border-radius:50%;background:var(--bk);flex:none}
.note{font-size:.82rem;color:var(--fg3)}

/* nav */
.nav{display:flex;align-items:center;gap:28px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.brand{background:none;border:0;padding:0;display:flex;align-items:baseline;gap:10px;text-align:left}
.bm{font-family:var(--latin);font-size:1.5rem;font-weight:500;letter-spacing:-.01em;color:var(--fg)}
.bs{font-size:.78rem;color:var(--fg3)}
.links{display:flex;flex-wrap:wrap;gap:4px 22px;flex:1}
.links button{background:none;border:0;padding:.2em 0;color:var(--fg2);border-bottom:1px solid transparent}
.links button:hover{color:var(--fg)}
.links button[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}
.links i{width:1px;background:var(--line);align-self:stretch}
.ico{background:none;border:0;color:var(--fg2);font-family:var(--latin);font-size:1.15rem;padding:2px 4px}
.ico:hover{color:var(--accent)}

/* tab bar */
.tabbar{display:none;position:sticky;bottom:0;z-index:30;background:var(--bg);border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));margin-top:8px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;color:var(--fg3);font-size:.72rem;border-radius:10px}
.tabs button[aria-current="page"]{color:var(--accent)}
.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.moremenu{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;padding:14px 4px 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.moremenu button{background:none;border:0;text-align:left;padding:8px 6px;color:var(--fg2)}
.moremenu button:hover{color:var(--accent)}
.spec{margin-top:8px}
.spec .tabbar{display:block;position:static;border:1px solid var(--line);border-radius:18px;max-width:390px;padding-inline:10px}

.btt{position:sticky;bottom:18px;height:0;z-index:25;display:flex;justify-content:flex-end;pointer-events:none}
.btt .c{position:absolute;bottom:0;right:0;pointer-events:auto}
.btt button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--fg2);display:grid;place-items:center;box-shadow:0 2px 10px rgb(0 0 0/.06)}
.btt button:hover{color:var(--accent)}
.btt svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.btt .tag{left:auto;right:0}

/* home */
.hero{display:flex;flex-direction:column;gap:14px;padding-top:26px}
.entries{display:flex;flex-direction:column}
.entry{display:flex;align-items:baseline;gap:18px;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:22px 0;text-align:left}
.entry:last-child{border-bottom:1px solid var(--line)}
.entry .t{font-family:var(--read);font-size:1.3rem;font-weight:500;min-width:9.5rem}
.entry .d{flex:1;color:var(--fg2);font-size:.93rem}
.entry .ar{color:var(--fg3);transition:transform .2s}
.entry:hover .t{color:var(--accent)} .entry:hover .ar{transform:translateX(4px);color:var(--accent)}
.soon{border:1px dashed var(--line);border-radius:14px;padding:18px 20px;color:var(--fg3);font-size:.92rem}
.shelf{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;height:230px;border-bottom:2px solid var(--fg);padding-bottom:0}
.spine{background:var(--bk);color:var(--bg);border:0;border-radius:4px 4px 0 0;writing-mode:vertical-rl;padding:14px 4px;font-family:var(--read);font-weight:500;font-size:.98rem;display:flex;align-items:center;justify-content:space-between;gap:10px;transition:transform .2s;min-width:0}
.spine:hover{transform:translateY(-6px)}
.spine small{font-family:var(--ui);font-size:.72rem;opacity:.85;font-weight:400}

/* daily */
.daily{display:flex;flex-direction:column;gap:14px;padding:6px 0}
.daily .read{font-size:calc(var(--fs)*1.12)}

/* search */
.field{display:flex;align-items:flex-end;gap:14px;border-bottom:1.5px solid var(--fg);padding-bottom:8px}
.field input{flex:1;min-width:0;background:none;border:0;outline:0;font-family:var(--read);font-size:1.45rem;padding:4px 0}
.field:focus-within{border-color:var(--accent)}
.field input::placeholder{color:var(--fg3)}
.hint{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;font-size:.93rem;color:var(--fg2)}
.srch{display:flex;align-items:center;gap:12px;color:var(--accent);font-size:.92rem}
.srch i{display:block;width:90px;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);background-size:200% 100%;animation:slide 1.1s linear infinite}
@keyframes slide{from{background-position:200% 0}to{background-position:-200% 0}}
.opts{display:flex;flex-wrap:wrap;gap:10px 26px;align-items:center}
.chk{display:inline-flex;gap:8px;align-items:center;cursor:pointer}
.chk input{accent-color:var(--accent);width:16px;height:16px}

/* cards */
.list{display:flex;flex-direction:column}
.card{padding:30px 0;border-top:1px solid var(--line);min-width:0}
.list>:first-child .card,.list>.card:first-child{border-top:0;padding-top:10px}
.ch{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bdg{width:26px;height:26px;border-radius:50%;background:var(--bk);color:var(--bg);display:grid;place-items:center;font-size:.7rem;flex:none;font-weight:500}
.ttl{background:none;border:0;padding:0;font-weight:500;color:var(--fg);text-align:left}
.ttl:hover{color:var(--accent)}
.card .read{font-size:calc(var(--fs)*.92);margin:12px 0 10px}
.cf{display:flex;align-items:center;gap:18px;flex-wrap:wrap;font-size:.86rem}
.tagn{font-size:.74rem;color:var(--accent);background:var(--accent-soft);padding:0 8px;border-radius:99px}
.cnt{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:baseline}
.cnt .big{font-size:1.05rem;font-weight:500}
.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;border-top:1px solid var(--line)}
.pager span{color:var(--fg3);font-size:.88rem}
.pager .btn{font-size:.95rem}
.filters{display:flex;flex-wrap:wrap;gap:8px}

/* hadis page */
.crumb{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:.88rem;color:var(--fg3)}
.crumb button{background:none;border:0;padding:0;color:var(--fg2)}
.crumb button:hover{color:var(--accent)}
.c.prog{position:sticky;top:calc(var(--cbh,56px) + env(safe-area-inset-top,0px));z-index:20;background:var(--bg);padding:10px 0 8px}
.prog .meta{display:flex;justify-content:space-between;gap:10px;font-size:.82rem;color:var(--fg3);margin-bottom:6px}
.bar{height:2px;background:var(--line);border-radius:2px}
.bar i{display:block;height:100%;width:var(--p,0%);background:var(--accent);transition:width .15s}
.article{display:flex;flex-direction:column;gap:18px;touch-action:pan-y}
.chain{display:flex;flex-direction:column;gap:6px;font-size:.93rem;color:var(--fg2)}
.chain .sum{display:flex;gap:10px;align-items:baseline}
.chain .sum span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chain.open .sum span{white-space:normal}
.chain .full{font-family:var(--read);font-size:.92rem;line-height:1.9;padding-left:14px;border-left:1px solid var(--line);color:var(--fg2)}
.article .read{font-size:var(--fs)}
.permal{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.84rem;color:var(--fg3)}
.permal code{font-family:var(--ui);color:var(--fg2);overflow-wrap:anywhere}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pn button{background:none;border:0;border-top:1px solid var(--line);padding:16px 0 4px;text-align:left;color:var(--fg2);display:flex;flex-direction:column;gap:2px}
.pn button:hover{color:var(--accent)}
.pn button:last-child{text-align:right;align-items:flex-end}
.pn small{color:var(--fg3);font-size:.78rem}
.rel{display:flex;flex-direction:column}
.rel .it{background:none;border:0;border-top:1px solid var(--line);padding:16px 0;text-align:left;display:flex;flex-direction:column;gap:4px;width:100%}
.rel .it:hover .rt{color:var(--accent)}
.rel .rt{display:flex;gap:10px;align-items:center;font-weight:500}
.rel .rx{font-family:var(--read);font-size:.98rem;color:var(--fg2);line-height:1.8}
.rel .rs{font-size:.78rem;color:var(--fg3)}

/* books */
.bbtn{display:flex;flex-wrap:wrap;gap:8px 10px}
.bbtn button{display:inline-flex;align-items:center;gap:8px;background:var(--soft);border:0;border-radius:999px;padding:6px 16px 6px 8px;color:var(--fg2)}
.bbtn button[aria-pressed="true"]{background:var(--bk);color:var(--bg)}
.bbtn button[aria-pressed="true"] .bdg{background:var(--bg);color:var(--bk)}
.ctrls{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 0}
.ctrls .rng{font-variant-numeric:tabular-nums;color:var(--fg);font-weight:500}
.ctrls .grp{display:flex;gap:16px}
.grid{display:flex;flex-wrap:wrap;gap:6px;max-height:150px;overflow:auto;padding:2px}
.grid .chip{font-size:.8rem;padding:.1em .7em;font-variant-numeric:tabular-nums}
.jump{display:flex;gap:12px;align-items:flex-end;border-bottom:1px solid var(--fg);padding-bottom:6px;max-width:26rem}
.jump input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:1.1rem;font-family:var(--read)}
.jump:focus-within{border-color:var(--accent)}

/* topics / narrators split */
.split{display:grid;grid-template-columns:15rem minmax(0,1fr);gap:40px;align-items:start}
.index{display:flex;flex-direction:column;max-height:30rem;overflow:auto;padding-right:8px;position:sticky;top:calc(var(--cbh,56px) + 12px)}
.index button{background:none;border:0;text-align:left;padding:6px 0;color:var(--fg2);display:flex;justify-content:space-between;gap:10px}
.index button:hover{color:var(--accent)}
.index button[aria-current="true"]{color:var(--accent);font-weight:600}
.index .bdg{width:22px;height:22px;font-size:.62rem}
.curated{background:var(--accent-soft);border-radius:14px;padding:22px 24px;display:flex;flex-direction:column;gap:6px}
.curated .cit{display:flex;flex-direction:column;gap:2px;padding:14px 0;border-top:1px solid var(--line)}
.curated .cit:first-of-type{border-top:0}
.bars{display:flex;flex-direction:column;gap:8px}
.bars .br{display:grid;grid-template-columns:6.5rem 1fr 3rem;gap:12px;align-items:center;font-size:.9rem}
.bars .br i{display:block;height:3px;background:var(--bk);border-radius:2px;width:var(--w)}
.bars .br b{font-weight:500;text-align:right;font-variant-numeric:tabular-nums}

/* compare */
.cmp{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:32px}
.cmp .col{display:flex;flex-direction:column;gap:12px;min-width:0}
.cmp .read{font-size:calc(var(--fs)*.88);line-height:1.95}
.cmp mark,.d{background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:0 2px;font-weight:600}
.scroller{overflow-x:auto}

/* share */
.qcard{--qb:#fbfaf7;--qf:#22201d;--qa:#7a3a4c;background:var(--qb);color:var(--qf);border-radius:6px;padding:9% 9% 7%;display:flex;flex-direction:column;justify-content:space-between;gap:20px;width:100%;max-width:340px;box-shadow:0 1px 0 var(--line),0 12px 30px rgb(0 0 0/.08);aspect-ratio:1/1;overflow:hidden}
.qcard.tall{aspect-ratio:9/14}
.qcard.ink{--qb:#1c1b19;--qf:#ece7df;--qa:#d99cab}
.qcard.sand{--qb:#ebe0cb;--qf:#3a2f22;--qa:#86392f}
.qcard .qt{font-family:'Noto Serif Bengali',serif;line-height:1.85;font-size:1rem;overflow:hidden}
.qcard .qm{font-family:var(--latin);font-size:2.6rem;line-height:.6;color:var(--qa)}
.qcard .qs{font-size:.76rem;display:flex;flex-direction:column;gap:2px;border-top:1px solid color-mix(in srgb,var(--qf) 18%,transparent);padding-top:10px}
.qcard .qs b{font-weight:500;color:var(--qa)}
.copyrow{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:12px}
.copyrow .v{font-family:var(--read);font-size:1rem;color:var(--fg);white-space:pre-line;overflow-wrap:anywhere}
.chat{background:var(--soft);border-radius:18px;padding:16px;display:flex;justify-content:flex-end}
.bubble{background:var(--bg);border-radius:14px 14px 4px 14px;max-width:290px;width:100%;overflow:hidden;box-shadow:0 1px 2px rgb(0 0 0/.08)}
.bubble .im{background:var(--accent);color:var(--on-accent);font-family:var(--read);padding:14px 16px;font-size:.88rem;line-height:1.7}
.bubble .tx{padding:10px 14px 12px;display:flex;flex-direction:column;gap:2px}
.bubble .tx b{font-weight:600;font-size:.92rem}
.bubble .tx span{font-size:.82rem;color:var(--fg2)}
.bubble .tx small{font-size:.74rem;color:var(--fg3)}
.serp{display:flex;flex-direction:column;gap:2px;max-width:36rem}
.serp .u{font-size:.82rem;color:var(--fg2)}
.serp .t{font-size:1.2rem;color:var(--accent);font-weight:500}
.serp .ds{font-size:.92rem;color:var(--fg2)}

/* comfort */
.ctlrow{display:grid;grid-template-columns:8rem 1fr 3.5rem;gap:16px;align-items:center}
.ctlrow input[type=range]{width:100%;accent-color:var(--accent)}
.ctlrow output{text-align:right;color:var(--fg3);font-variant-numeric:tabular-nums}
.themes{display:flex;gap:10px;flex-wrap:wrap}
.themes button{display:inline-flex;gap:8px;align-items:center;background:none;border:1px solid var(--line);border-radius:99px;padding:4px 14px 4px 6px}
.themes button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.sw-dot{width:18px;height:18px;border-radius:50%;border:1px solid var(--line)}

/* plans / sheet */
.plans{display:flex;flex-direction:column}
.plan{display:flex;justify-content:space-between;gap:16px;align-items:baseline;background:none;border:0;border-top:1px solid var(--line);padding:14px 0;text-align:left;width:100%}
.plan[aria-pressed="true"] .pn1{color:var(--accent)}
.plan .pn1{font-family:var(--read);font-size:1.12rem;font-weight:500}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.days button{aspect-ratio:1;border-radius:50%;background:var(--soft);border:0;font-size:.8rem;color:var(--fg2);font-variant-numeric:tabular-nums}
.days button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.days button.today{outline:1.5px solid var(--accent);outline-offset:2px}
.paper{background:#fff;color:#1b1a18;border-radius:4px;padding:32px 34px;box-shadow:0 1px 0 var(--line),0 10px 28px rgb(0 0 0/.08);display:flex;flex-direction:column;gap:18px;max-width:34rem}
.paper h3{font-family:'Noto Serif Bengali',serif;font-weight:600;font-size:1.25rem;border-bottom:1.5px solid #1b1a18;padding-bottom:10px}
.paper ol{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:16px;font-family:'Noto Serif Bengali',serif;line-height:1.9;font-size:.98rem}
.paper li small{display:block;color:#5d5851;font-family:'Hind Siliguri',sans-serif;font-size:.8rem}
.paper .ft{font-size:.74rem;color:#8f897f;border-top:1px solid #e7e3dc;padding-top:8px}
.picks{display:flex;flex-direction:column;gap:2px}
.picks .chk{padding:6px 0}

/* states */
.spin{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:rot .9s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.skel{height:12px;border-radius:6px;background:var(--soft);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.state{display:flex;flex-direction:column;gap:10px;align-items:flex-start;padding:10px 0}
.state .bg{font-family:var(--latin);font-size:4.5rem;line-height:1;color:var(--line);font-weight:400}
.states{display:grid;grid-template-columns:1fr 1fr;gap:44px 48px}

.chan{display:flex;align-items:center;gap:16px;padding:16px 0;border-top:1px solid var(--line);color:var(--fg3)}

.fake{width:34px;height:20px;border-radius:99px;background:var(--line);position:relative;opacity:.7}

.map{width:100%;border-collapse:collapse;font-size:.88rem}
.map td,.map th{padding:9px 10px 9px 0;border-top:1px solid var(--line);text-align:left;vertical-align:top}
.map th{font-weight:500;color:var(--fg3);font-size:.78rem;border-top:0}
.map .cd{font-weight:600;white-space:nowrap}
.map .pl{font-size:.7rem;padding:0 8px;border-radius:99px;white-space:nowrap;display:inline-block}

.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.85rem;align-items:center}
.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:var(--accent-soft)}100%{background:transparent}}

/* footer */
.foot{border-top:1px solid var(--line);padding:30px 0 34px;display:flex;flex-direction:column;gap:12px;font-size:.88rem;color:var(--fg3)}
.foot .fl{display:flex;flex-wrap:wrap;gap:6px 20px}
.foot .fl button{background:none;border:0;padding:0;color:var(--fg2)}
.foot .fl button:hover{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:8px 18px;border-radius:99px;font-size:.88rem;opacity:0;pointer-events:none;transition:.25s;z-index:100;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.fade{animation:fi .3s ease-out}
@keyframes fi{from{opacity:0}to{opacity:1}}

/* narrow frame = phone layout */
@container f (max-width:640px){
  .links,.nav .sp{display:none}
  .nav{justify-content:space-between}
  .tabbar{display:block}
  .spec{display:none}

  .shelf{height:210px;gap:5px}
  .spine{font-size:.86rem;padding:10px 2px}
  .lbl .c{outline-offset:5px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

 return [(s>0?'… ':'')+t.slice(s,e)+(e<t.length?' …':''),s>0||e<t.length]}

function resultSet(){
 const re=qRe(S.q);let list=H.filter(h=>matchH(h,S.q));
 const def=S.q.trim()==='বলেছেন';
 list.sort((a,b)=>((b.text.match(new RegExp(re.source,'g'))||[]).length-(a.text.match(new RegExp(re.source,'g'))||[]).length)||a.text.length-b.text.length);
 const counts={};BOOKS.forEach(b=>counts[b.id]=def?RESCOUNT[b.id]:list.filter(h=>h.b===b.id).length);
 const total=def?403:list.length;
 let shown=S.filter==='all'?list:list.filter(h=>h.b===S.filter);
 const tot=S.filter==='all'?total:counts[S.filter];
 return {re,list:shown,counts,total,tot}}

 const art=$('#art');if(art){let x0=null,y0=0;
  art.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
  art.addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;x0=null;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6)stepH(dx<0?1:-1)})}
}
const D=s=>S.digits==='en'?s.replace(/[০-৯]/g,d=>BN.indexOf(d)):s;
function stepH(d){const i=RING.indexOf(S.cur);S.cur=RING[(i+d+RING.length)%RING.length];S.chainOpen=false;render(false);window.scrollTo(0,0);toast(d>0?'পরের হাদীসে গেলেন':'আগের হাদীসে গেলেন')}
function busy(fn){S.searching=true;render(true);setTimeout(()=>{S.searching=false;fn();render(true)},900)}
function runSearch(v){
 v=(v||'').trim();if(!v){toast('আগে কিছু লিখুন');return}
 const r=roman(v);if(r)v=r[0];
 const j=parseJump(v);if(j){const h=H.find(h=>h.b===j.b&&h.no===j.no);if(h){S.cur=h.id;go('hadis');return}}
 S.typed=v;S.searching=true;
 if(S.screen==='search'){render(true);setTimeout(()=>{S.searching=false;S.q=v;S.filter='all';S.page=1;go('results')},900)}
 else{render(true);setTimeout(()=>{S.searching=false;S.q=v;S.filter='all';S.page=1;render(true)},900)}}
function jump(v){const j=parseJump(v);
 if(!j){toast('এভাবে লিখুন: বুখারী ১২৩৪');return}
 const b=B(j.b);if(j.no<1||j.no>b.count){toast(b.n+'-এ সর্বোচ্চ নম্বর '+num(b.count));return}
 const h=H.find(h=>h.b===j.b&&h.no===j.no);if(h){S.cur=h.id;go('hadis');return}
 S.book=j.b;S.bstart=Math.floor((j.no-1)/20)*20;render(true);toast(b.n+' '+bn(j.no)+' নম্বরের পাতায় গেলেন')}

/* toast + copy */
let tt;function toast(m){const t=$('#toast');t.textContent=D(m);t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1900)}
async function copyText(t){try{await navigator.clipboard.writeText(t);return true}catch(e){try{const ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();return ok}catch(e2){return false}}}
async function doCopy(btn,text,msg){const ok=await copyText(text);const old=btn.textContent;
 if(ok){btn.textContent='কপি করা হয়েছে';setTimeout(()=>{btn.textContent=old},1700)}else toast('কপি করা যায়নি, লেখাটি নির্বাচন করে কপি করুন');if(msg&&ok)toast(msg)}

/* actions */
const A={
 go(t,d){const id=d.id;if(d.go==='hadis'&&id)S.cur=id,S.chainOpen=false;if(d.book){S.book=d.book;S.bstart=0}go(d.go);return false},
 more(){S.more=!S.more},
 top(){window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});return false},
 chain(){S.chainOpen=!S.chainOpen},
 copy(t,d){const h=HB(d.id);doCopy(t,h.text+'\n\n'+cite(h)+'\n'+url(h));return false},
 copycite(t,d){doCopy(t,cite(HB(d.id)),'উদ্ধৃতি কপি হয়েছে');return false},
 copylink(t,d){doCopy(t,url(HB(d.id)),'লিংক কপি হয়েছে');return false},
 copyshare(t,d){const h=HB(d.id);const body=h.body.length>190?h.body.slice(0,190).replace(/\s+\S*$/,'')+' …':h.body;doCopy(t,`“${body}”\n— ${h.narr} থেকে বর্ণিত\n${cite(h)}\n${url(h)}`);return false},
 share(t,d){S.shareId=d.id;go('share');return false},
 addcmp(t,d){if(!S.cmp.includes(d.id)){if(S.cmp.length>=4)S.cmp.shift();S.cmp.push(d.id)}toast('তুলনায় যোগ হয়েছে');return false},
 nav(t,d){S.cur=d.v;S.chainOpen=false;render(false);window.scrollTo(0,0);return false},
 filter(t,d){S.filter=d.v;S.page=1},
 page(t,d){S.page=+d.v;window.scrollTo(0,0)},
 tpager(t,d){S.tpage=+d.v},
 chip(t,d){S.typed=d.v;runSearch(d.v);return false},
 pick(t,d){S.typed=d.v;if(S.screen==='search'){const qi=$('#qin');qi.value=d.v;qi.focus();$('#helper').innerHTML=helperHTML();applyDigits($('#helper'));return false}
  S.q=d.v;S.filter='all';S.page=1;render(true);return false},
 shpick(t,d){S.shareId=d.v},
 qstyle(t,d){S.qstyle=d.v},qshape(t,d){S.qshape=d.v},
 saveimg(){toast('বাস্তব সাইটে এখানে ছবি সংরক্ষণ হবে');return false},
 book(t,d){S.book=d.v;S.bstart=0},
 bmove(t,d){const b=B(S.book);S.bstart=Math.max(0,Math.min(b.count-1,S.bstart+(+d.v)))},
 brange(t,d){S.bstart=+d.v},
 topic(t,d){S.topic=d.v;S.tpage=1},
 narr(t,d){S.narr=d.v},
 cmptoggle(t,d){const i=S.cmp.indexOf(d.v);if(t.checked){if(S.cmp.length>=4){t.checked=false;toast('সর্বোচ্চ চারটি হাদীস তুলনা করা যায়');return false}S.cmp.push(d.v)}else{if(S.cmp.length<=2){t.checked=true;toast('কমপক্ষে দুইটি হাদীস লাগবে');return false}S.cmp.splice(i,1)}},
 season(t,d){S.season=d.v},
 plan(t,d){S.plan=d.v},
 day(t,d){const a=S.done[S.plan],n=+d.v,i=a.indexOf(n);i>-1?a.splice(i,1):a.push(n)},
 shtoggle(t,d){const i=S.sheet.indexOf(d.v);i>-1?S.sheet.splice(i,1):S.sheet.push(d.v)},
 copysheet(t){doCopy(t,'জুমু\'আর খুতবা · নির্বাচিত হাদীস\n'+S.sheet.map((id,i)=>{const h=HB(id);return bn(i+1)+'. '+h.body+' ('+cite(h)+')'}).join('\n'));return false},
 digits(t,d){S.digits=d.v},
 theme(t,d){setTheme(d.v);return false},
 retry(){toast('আবার চেষ্টা করা হচ্ছে...');return false},
 maplink(t,d){go(d.v,{focus:d.c});return false}
};
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-act],[data-go]');if(!t||!app.contains(t))return;
 const d=t.dataset;let r;
 if(d.act&&A[d.act])r=A[d.act](t,d);else if(d.go)r=A.go(t,d);
 if(d.act==='pick'&&d.run){S.q=d.v;S.filter='all';S.page=1;render(true);return}
 if(r!==false)render(true)});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.act==='cmptoggle'&&app.contains(t)){const r=A.cmptoggle(t,t.dataset);if(r!==false)render(true)}
 if(t.dataset&&t.dataset.act==='shtoggle'&&app.contains(t)){A.shtoggle(t,t.dataset);render(true)}});
document.addEventListener('keydown',e=>{if(S.screen==='hadis'&&!/INPUT|SELECT|TEXTAREA/.test((e.target||{}).tagName||'')){if(e.key==='ArrowRight')stepH(1);if(e.key==='ArrowLeft')stepH(-1)}});

/* progress */
function updateProg(){const p=$('.prog .bar i');if(!p)return;const tx=$('#art .read');if(!tx)return;
 const r=tx.getBoundingClientRect(),vh=window.innerHeight;const f=Math.max(0,Math.min(1,(vh*0.75-r.top)/r.height));
 p.style.setProperty('--p',Math.round(f*100)+'%');p.parentNode.style.setProperty('--p',Math.round(f*100)+'%');const pc=$('#pct');if(pc)pc.textContent=D(bn(Math.round(f*100)))+'% পড়া হয়েছে'}
let raf;window.addEventListener('scroll',()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(updateProg)},{passive:true});
window.addEventListener('resize',()=>{setCbh();updateProg()});
function setCbh(){document.documentElement.style.setProperty('--cbh',$('#ctl').offsetHeight+'px')}

/* control bar */
function setTheme(t){S.theme=t;const r=document.documentElement;
 if(t==='auto'){r.removeAttribute('data-theme');r.removeAttribute('data-skin')}
 else if(t==='sepia'){r.dataset.theme='light';r.dataset.skin='sepia'}
 else{r.dataset.theme=t;r.removeAttribute('data-skin')}
 document.querySelectorAll('#tseg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===t));
 if(S.screen==='comfort')render(true)}
function initCtl(){
 const sel=$('#scrsel');sel.innerHTML=SCREENS.map(([k,l],i)=>`<option value="${k}">${i+1}. ${l}</option>`).join('');
 sel.addEventListener('change',()=>go(sel.value));
 $('#lblsw').addEventListener('change',e=>{S.labels=e.target.checked;document.body.classList.toggle('lbl',S.labels)});
 $('#wseg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.phone=b.dataset.w==='phone';document.querySelectorAll('#wseg button').forEach(x=>x.setAttribute('aria-pressed',x===b));$('#stage').classList.toggle('phone',S.phone)});
 $('#tseg').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setTheme(b.dataset.t)});
 if(window.innerWidth<700){S.phone=true;document.querySelectorAll('#wseg button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.w==='phone'))}
 const h=(location.hash||'').slice(1);if(SCR[h])S.screen=h;
 setCbh();
}
initCtl();render(false);setCbh();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(setCbh);
})();
</script>

</body></html>
